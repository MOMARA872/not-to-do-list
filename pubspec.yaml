name: not_to_do_list
description: "Not To-Do List — mindful avoidance for self-disciplined adults"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.41.0

# Phase 1 dep notes (2026-05-04):
# - riverpod_annotation/_generator dropped — they pin analyzer minors that
#   conflict with pigeon 26.3.4 + Flutter 3.41 (meta 1.17). Providers in this
#   phase are hand-written. Reintroduce when ecosystem converges on analyzer 12+.
# - custom_lint/riverpod_lint dropped for the same reason. Lint enforcement
#   is still active via very_good_analysis.

dependencies:
  archive: ^4.0.9
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  dynamic_color: ^1.7.0
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.0.3
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^26.3.4
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
    - assets/logos/
    - docs/PRIVACY.md
